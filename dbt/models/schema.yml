version: 2

models:
  - name: dim_customers
    description: "Certified Customer Master Dimension Table"
    columns:
      - name: customer_id
        description: "Primary key for customer dimension"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer standardized contact email"
        tests:
          - not_null

  - name: fct_transactions
    description: "Certified General Ledger Transactions Fact Table"
    columns:
      - name: txn_id
        description: "Primary key for financial ledger transactions"
        tests:
          - unique
          - not_null
      - name: currency
        description: "ISO currency code"
        tests:
          - not_null
          - accepted_values:
              values: ['USD', 'EUR', 'GBP']
      - name: amount_usd
        description: "Transaction amount in USD"
        tests:
          - not_null

  - name: fct_monthly_mrr
    description: "Monthly recurring revenue aggregation mart"
    columns:
      - name: settlement_month
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
