global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'aegis-governance-monitor'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'aegis-backend'
    scrape_interval: 10s
    metrics_path: '/api/v1/health'
    static_configs:
      - targets: ['backend:8000']
        labels:
          environment: 'production'
          service: 'fastapi-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka-broker'
    static_configs:
      - targets: ['kafka:9092']
        labels:
          service: 'kafka-streaming'
